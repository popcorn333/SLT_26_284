hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${hydra.job.name}
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - +data=data_swp
    - model.masking.alpha=1.8,1.9
  job:
    name: Hydra_${basename}
    chdir: true
    override_dirname: model.masking.alpha:1.8,1.9
    id: ???
    num: ???
    config_name: config_swp
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: ':'
        item_sep: __
        exclude_keys:
        - data
        - eval.evaluation_mode
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /mnt/parscratch/users/acp23xt/private/DTDM_Unet/levy
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/parscratch/users/acp23xt/private/DTDM_Unet/levy/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      data: data_swp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
basename: levy
data:
  train_filelist_path: ../../resources/filelists/ljspeech/train.txt
  dev_filelist_path: ../../resources/filelists/ljspeech/valid.txt
  test_filelist_path: ../../resources/filelists/ljspeech/test.txt
  cmudict_path: ../../resources/cmu_dictionary
  add_blank: true
  n_spks: 1
  n_feats: 80
  n_fft: 1024
  sample_rate: 22050
  hop_length: 256
  win_length: 1024
  f_min: 0
  f_max: 8000
eval: null
model:
  spk_emb_dim: 128
  encoder:
    n_channels: 192
    filter_channels: 768
    filter_channels_dp: 256
    n_layers: 6
    kernel_size: 3
    p_dropout: 0.1
    n_heads: 2
    window_size: 4
  decoder:
    dim: 64
    beta_min: 0.05
    beta_max: 20.0
    pe_scale: 1000
  masking:
    a: 0.2
    b: 0
    c: 0
    d: 0
    alpha: 2.0
training:
  load_encoder: true
  load_decoder: false
  train_encoder: false
  n_timesteps: 10
  tensorboard_dir: tb
  start_checkpoint: 0
  n_epochs: 600
  pre_checkpoint: ../../checkpts/grad-tts-new_${training.start_checkpoint}.pt
  checkpoint_save: checkpoint
  test_size: 1
  batch_size: 28
  learning_rate: 5.0e-05
  seed: 37
  save_every: 5
  gpu: 0
  num_workers: 4
