basename: score
data:
  train_filelist_path: ../../resources/filelists/ljspeech/train.txt
  dev_filelist_path: ../../resources/filelists/ljspeech/valid.txt
  test_filelist_path: ../../resources/filelists/ljspeech/test.txt
  cmudict_path: ../../resources/cmu_dictionary
  add_blank: true
  n_spks: 1
  n_feats: 80
  n_fft: 1024
  sample_rate: 22050
  hop_length: 256
  win_length: 1024
  f_min: 0
  f_max: 8000
eval: null
model:
  spk_emb_dim: 128
  encoder:
    n_channels: 192
    filter_channels: 768
    filter_channels_dp: 256
    n_layers: 6
    kernel_size: 3
    p_dropout: 0.1
    n_heads: 2
    window_size: 4
  decoder:
    dim: 64
    beta_min: 0.05
    beta_max: 20.0
    pe_scale: 1000
  masking:
    a: 0.8
    b: 0
    c: 0
    d: 0
training:
  load_encoder: true
  load_decoder: false
  train_encoder: false
  n_timesteps: 10
  tensorboard_dir: tb
  start_checkpoint: 0
  n_epochs: 600
  pre_checkpoint: ../../checkpts/grad-tts-new_${training.start_checkpoint}.pt
  checkpoint_save: checkpoint
  test_size: 1
  batch_size: 28
  learning_rate: 5.0e-05
  seed: 37
  save_every: 5
  gpu: 0
  num_workers: 4
